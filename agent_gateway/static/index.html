<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Gateway</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f8f9fb; --line: #e5e7eb; --line-strong: #d1d5db;
    --text: #111827; --text-2: #4b5563; --muted: #6b7280; --faint: #9ca3af;
    --accent: #2563eb; --accent-hover: #1d4ed8; --accent-soft: #eff6ff; --on-accent: #ffffff;
    --ok: #16a34a; --ok-soft: #ecfdf5; --warn: #d97706; --warn-soft: #fffbeb; --err: #dc2626; --err-soft: #fef2f2;
    --user-bubble: #2563eb; --user-text: #ffffff; --code-bg: #f3f4f6;
    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.18);
    --r: 8px; --r-lg: 12px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0d12; --surface: #12151c; --surface-2: #171b24; --line: #232833; --line-strong: #323847;
      --text: #e5e7eb; --text-2: #b4bac6; --muted: #8b93a3; --faint: #5f6675;
      --accent: #3b82f6; --accent-hover: #60a5fa; --accent-soft: #172036; --on-accent: #ffffff;
      --ok: #22c55e; --ok-soft: #10231a; --warn: #f59e0b; --warn-soft: #2a2110; --err: #ef4444; --err-soft: #2a1414;
      --user-bubble: #2f5fd6; --code-bg: #0c0f15;
      --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 24px 60px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0d12; --surface: #12151c; --surface-2: #171b24; --line: #232833; --line-strong: #323847;
    --text: #e5e7eb; --text-2: #b4bac6; --muted: #8b93a3; --faint: #5f6675;
    --accent: #3b82f6; --accent-hover: #60a5fa; --accent-soft: #172036; --on-accent: #ffffff;
    --ok: #22c55e; --ok-soft: #10231a; --warn: #f59e0b; --warn-soft: #2a2110; --err: #ef4444; --err-soft: #2a1414;
    --user-bubble: #2f5fd6; --code-bg: #0c0f15;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 24px 60px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { font: 13.5px/1.55 var(--font); color: var(--text); background: var(--bg); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { white-space: nowrap; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 11px; line-height: 1.3; display: inline-flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s, color .12s; }
  button:hover { background: var(--surface-2); border-color: var(--line-strong); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button.danger { color: var(--err); }
  button.danger:hover { background: var(--err-soft); border-color: var(--err); }
  button.ghost { border-color: transparent; background: transparent; padding: 4px 6px; color: var(--muted); }
  button.ghost:hover { background: var(--surface-2); color: var(--text); }
  button.icon { padding: 5px; border-radius: 6px; }
  input, textarea, select { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; width: 100%; outline: none; transition: border-color .12s, box-shadow .12s; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  svg.i { width: 15px; height: 15px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .mono { font-family: var(--mono); font-size: 12px; }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); }
  .chip b { font-weight: 600; color: var(--text); }
  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; letter-spacing: .02em; text-transform: uppercase; }
  .pill.idle { background: var(--ok-soft); color: var(--ok); }
  .pill.busy { background: var(--warn-soft); color: var(--warn); }
  .pill.error { background: var(--err-soft); color: var(--err); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
  .dot.idle { background: var(--ok); }
  .dot.busy { background: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(217,119,6,.45); } 50% { box-shadow: 0 0 0 5px rgba(217,119,6,0); } }
  .empty { color: var(--muted); text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .empty svg.i { width: 28px; height: 28px; color: var(--faint); }
  .empty h3 { margin: 0; font-size: 14px; color: var(--text-2); font-weight: 600; }
  .empty p { margin: 0; font-size: 12.5px; }
  .kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--muted); }

  /* ---- 顶栏 ---- */
  .topbar { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; margin-right: 8px; }
  .brand .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), #7c3aed); display: grid; place-items: center; color: #fff; }
  .brand .logo svg.i { width: 13px; height: 13px; stroke-width: 2.2; }
  .topbar .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .topbar .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .sse { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

  /* ---- 主体 ---- */
  .app { flex: 1; display: grid; grid-template-columns: 280px minmax(0, 1fr) 380px; min-height: 0; }
  .app.inspector-collapsed { grid-template-columns: 280px minmax(0, 1fr) 0; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .sidebar .head { padding: 12px 12px 8px; display: flex; flex-direction: column; gap: 8px; }
  .sidebar .head button.primary { width: 100%; justify-content: center; padding: 8px; }
  .search { position: relative; }
  .search svg.i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search input { padding-left: 30px; background: var(--surface-2); }
  .session-list { flex: 1; overflow: auto; padding: 4px 8px 12px; }
  .session-item { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--r); cursor: pointer; border: 1px solid transparent; }
  .session-item:hover { background: var(--surface-2); }
  .session-item.active { background: var(--accent-soft); border-color: transparent; }
  .session-item .title { font-weight: 600; font-size: 13px; }
  .session-item .meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; }
  .session-item .del { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: none; }
  .session-item:hover .del { display: inline-flex; }
  .session-item .del:hover { color: var(--err); }
  .group-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); padding: 10px 10px 4px; }

  /* ---- 会话区 ---- */
  .conv { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--bg); }
  .conv-head { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .conv-head .title { font-weight: 700; font-size: 14px; }
  .conv-head .sub { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); }
  .copyable { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; border-radius: 4px; padding: 1px 4px; }
  .copyable:hover { background: var(--surface-2); color: var(--text); }
  .copyable svg.i { width: 12px; height: 12px; opacity: .6; }
  .thread-wrap { flex: 1; position: relative; min-height: 0; }
  .thread { position: absolute; inset: 0; overflow: auto; padding: 22px 20px 12px; }
  .thread-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; flex-direction: column; gap: 6px; }
  .msg.user { align-items: flex-end; }
  .bubble { max-width: 78%; background: var(--user-bubble); color: var(--user-text); padding: 9px 13px; border-radius: 16px 16px 4px 16px; white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow); }
  .msg .stamp { font-size: 11px; color: var(--faint); font-family: var(--mono); padding: 0 4px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .card .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .card .who .avatar { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), #7c3aed); display: grid; place-items: center; color: #fff; }
  .card .who .avatar svg.i { width: 12px; height: 12px; }
  .card .foot { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--faint); font-family: var(--mono); border-top: 1px dashed var(--line); padding-top: 6px; }
  .md { word-break: break-word; }
  .md p { margin: 0 0 8px; } .md p:last-child { margin-bottom: 0; }
  .md h1, .md h2, .md h3 { margin: 10px 0 6px; font-size: 14px; }
  .md ul, .md ol { margin: 4px 0 8px; padding-left: 22px; }
  .md li { margin: 2px 0; }
  .md code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .md pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; overflow: auto; margin: 6px 0 8px; }
  .md pre code { border: 0; background: none; padding: 0; }
  .md a { color: var(--accent); }
  .md blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid var(--line-strong); color: var(--text-2); }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  .tool { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); overflow: hidden; }
  .tool > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 7px 10px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
  .tool > summary::-webkit-details-marker { display: none; }
  .tool > summary .chev { transition: transform .15s; color: var(--faint); }
  .tool[open] > summary .chev { transform: rotate(90deg); }
  .tool > summary .name { font-weight: 600; }
  .tool > summary .title { color: var(--muted); font-family: var(--font); }
  .tool .body { border-top: 1px solid var(--line); padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  .tool .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--faint); margin-bottom: 4px; }
  .tool pre { margin: 0; font-family: var(--mono); font-size: 12px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
  .tool pre.clamp { max-height: 160px; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 12px; font-family: var(--mono); font-size: 12px; }
  .kv .k { color: var(--muted); }
  .kv .v { white-space: pre-wrap; word-break: break-word; }
  .st { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; font-family: var(--font); }
  .st.running { background: var(--warn-soft); color: var(--warn); }
  .st.completed { background: var(--ok-soft); color: var(--ok); }
  .st.error { background: var(--err-soft); color: var(--err); }
  .st.running .dot { width: 6px; height: 6px; background: var(--warn); animation: pulse 1.2s infinite; }
  .errbar { border: 1px solid var(--err); background: var(--err-soft); color: var(--err); border-radius: var(--r); padding: 8px 12px; display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; }
  .interact { border: 1px solid var(--accent); background: var(--accent-soft); border-radius: var(--r-lg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .interact .head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--accent); font-weight: 600; }
  .interact .q { font-weight: 600; }
  .interact .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .interact .opts input { width: auto; flex: 1; min-width: 160px; }
  .to-bottom { position: absolute; right: 24px; bottom: 14px; box-shadow: var(--shadow-lg); border-radius: 999px; padding: 6px 12px; font-size: 12px; }

  .composer { padding: 12px 20px 14px; background: var(--surface); border-top: 1px solid var(--line); }
  .composer-inner { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
  .composer .box { display: flex; align-items: flex-end; gap: 8px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 8px 8px 8px 12px; transition: border-color .12s, box-shadow .12s; }
  .composer .box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .composer textarea { border: 0; padding: 4px 0; resize: none; max-height: 200px; min-height: 24px; background: transparent; box-shadow: none; line-height: 1.5; }
  .composer textarea:focus { box-shadow: none; }
  .composer .hint { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); padding: 0 4px; }
  #btn-send { padding: 7px 12px; white-space: nowrap; flex: 0 0 auto; }

  /* ---- 检查器 ---- */
  .inspector { background: var(--surface); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .app.inspector-collapsed .inspector { display: none; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); padding: 0 8px; height: 52px; align-items: flex-end; gap: 2px; }
  .tab { border: 0; background: none; border-radius: 0; padding: 10px 10px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tab:hover { background: none; color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab .count { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
  .tab .count:empty { display: none; }
  .panel { flex: 1; min-height: 0; display: none; flex-direction: column; }
  .panel.active { display: flex; }
  .panel .toolbar { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .panel .toolbar input { padding: 5px 8px; font-size: 12px; }
  .panel .toolbar label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .panel .toolbar label input { width: auto; }
  .panel .list { flex: 1; overflow: auto; }
  .pending-item { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; }
  .pending-item .k { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .ev { padding: 6px 12px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 12px; }
  .ev:hover { background: var(--surface-2); }
  .ev .line { display: flex; align-items: center; gap: 8px; }
  .ev .t { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
  .ev.c-server .t { color: var(--muted); } .ev.c-session .t { color: var(--ok); } .ev.c-message .t { color: var(--accent); }
  .ev.c-question .t, .ev.c-permission .t { color: var(--warn); } .ev.c-error .t { color: var(--err); }
  .ev .time { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-left: auto; white-space: nowrap; }
  .ev .sum { color: var(--text-2); font-family: var(--mono); font-size: 11.5px; margin-top: 3px; }
  .ev pre { display: none; margin: 6px 0 0; font-family: var(--mono); font-size: 11px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; white-space: pre-wrap; word-break: break-word; }
  .ev.open pre { display: block; }
  .info { padding: 12px; display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; font-size: 12.5px; align-content: start; }
  .info .k { color: var(--muted); }
  .info .v { word-break: break-all; }

  /* ---- 对话框 ---- */
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--surface); color: var(--text); box-shadow: var(--shadow-lg); width: 560px; max-width: 94vw; }
  dialog::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(2px); }
  dialog .dh { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 14px; }
  dialog .dh .close { margin-left: auto; }
  dialog .db { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  dialog .df { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--line); }
  dialog .df .spacer { flex: 1; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
  .field .help { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .recent { display: flex; flex-wrap: wrap; gap: 6px; }
  .recent .chip { cursor: pointer; }
  .recent .chip:hover { border-color: var(--accent); color: var(--accent); }
  #browser { width: 680px; }
  .crumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; font-family: var(--mono); font-size: 12px; }
  .crumbs button { padding: 2px 6px; border-color: transparent; background: none; color: var(--text-2); }
  .crumbs button:hover { background: var(--surface-2); color: var(--text); }
  .crumbs .sep { color: var(--faint); }
  .dirlist { border: 1px solid var(--line); border-radius: var(--r); height: 320px; overflow: auto; }
  .dir { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .dir:last-child { border-bottom: 0; }
  .dir:hover { background: var(--surface-2); }
  .dir.active { background: var(--accent-soft); }
  .dir svg.i { color: var(--warn); }
  #confirm { width: 420px; }

  /* ---- Toast ---- */
  .toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--r); padding: 9px 12px; font-size: 12.5px; box-shadow: var(--shadow-lg); min-width: 220px; max-width: 380px; animation: rise .18s ease-out; }
  .toast.ok { border-left-color: var(--ok); } .toast.err { border-left-color: var(--err); }
  @keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>

<div class="toasts" id="toasts"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { health: null, sessions: [], current: null, messages: [], pending: {}, events: [], evPaused: false, sending: false };
const ICON = (n) => `<svg class="i"><use href="#i-${n}"/></svg>`;

/* ---------- 基础 ---------- */
const api = async (method, path, body) => {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 204) return null;
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(`${data.code || r.status}: ${data.message || r.statusText}`);
  return data;
};
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pretty = (v) => (typeof v === "string" ? v : JSON.stringify(v, null, 2));
const shortId = (id) => (id || "").replace(/^(ses|msg|req|perm)_/, "").slice(0, 8);
const fmtTime = (iso) => { if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleTimeString("zh-CN", { hour12: false }); };
const relTime = (iso) => {
  const d = new Date(iso); if (isNaN(d)) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 60) return "刚刚"; if (s < 3600) return `${Math.floor(s / 60)} 分钟前`; if (s < 86400) return `${Math.floor(s / 3600)} 小时前`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)} 天前`;
  return d.toLocaleDateString("zh-CN");
};
function toast(msg, kind = "") {
  const el = document.createElement("div"); el.className = `toast ${kind}`; el.textContent = msg;
  $("toasts").appendChild(el); setTimeout(() => el.remove(), 3200);
}
async function copyText(text) { try { await navigator.clipboard.writeText(text); toast("已复制", "ok"); } catch { toast("复制失败", "err"); } }
function confirmDialog(title, text) {
  return new Promise((resolve) => {
    $("confirm-title").textContent = title; $("confirm-text").textContent = text;
    const dlg = $("confirm"); const ok = $("confirm-ok");
    const done = (v) => { dlg.close(); ok.onclick = null; dlg.onclose = null; resolve(v); };
    ok.onclick = () => done(true); dlg.onclose = () => resolve(false);
    dlg.showModal();
  });
}
document.querySelectorAll("dialog [data-close]").forEach((b) => (b.onclick = () => b.closest("dialog").close()));

/* ---------- Markdown（轻量） ---------- */
function md(src) {
  const blocks = []; let text = String(src ?? "");
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => { blocks.push(`<pre><code class="lang-${esc(lang)}">${esc(code.replace(/\n$/, ""))}</code></pre>`); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = (s) => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = text.split("\n"); const out = []; let list = null; let para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${inline(para.join("\n"))}</p>`); para = []; } };
  const flushList = () => { if (list) { out.push(`<${list.tag}>${list.items.map((i) => `<li>${inline(i)}</li>`).join("")}</${list.tag}>`); list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, "");
    let m;
    if (/^\u0000\d+\u0000$/.test(line.trim())) { flushPara(); flushList(); out.push(blocks[+line.trim().slice(1, -1)]); continue; }
    if ((m = line.match(/^(#{1,3})\s+(.*)$/))) { flushPara(); flushList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { flushPara(); if (!list || list.tag !== "ul") { flushList(); list = { tag: "ul", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (!list || list.tag !== "ol") { flushList(); list = { tag: "ol", items: [] }; } list.items.push(m[1]); continue; }
    if ((m = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if (!line.trim()) { flushPara(); flushList(); continue; }
    flushList(); para.push(line);
  }
  flushPara(); flushList();
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, i) => blocks[+i]);
}

/* ---------- 顶栏 ---------- */
async function loadHealth() {
  try {
    state.health = await api("GET", "/health");
  } catch (e) { $("h-engine").textContent = "unavailable"; toast(e.message, "err"); return; }
  const h = state.health;
  $("h-engine").textContent = h.engine; $("h-model").textContent = h.model;
  $("h-tools").textContent = h.tools.length; $("h-tools-chip").title = h.tools.join("\n");
  $("h-skills").textContent = h.skills.length; $("h-skills-chip").title = h.skills.join("\n");
  $("h-perm").textContent = h.permission_mode;
}
function applyTheme(t) {
  if (t === "system") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem("gw.theme", t); } catch {}
  const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  $("btn-theme").innerHTML = ICON(dark ? "sun" : "moon");
}
$("btn-theme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  applyTheme(cur === "dark" ? "light" : "dark");
};
$("btn-inspector").onclick = () => { $("app").classList.toggle("inspector-collapsed"); try { localStorage.setItem("gw.inspector", $("app").classList.contains("inspector-collapsed") ? "0" : "1"); } catch {} };

/* ---------- 会话列表 ---------- */
async function loadSessions() { state.sessions = await api("GET", "/session"); renderSessions(); renderHead(); updateComposer(); renderInfo(); }
function renderSessions() {
  const q = $("search").value.trim().toLowerCase();
  const list = state.sessions.filter((s) => !q || s.title.toLowerCase().includes(q) || s.id.includes(q) || (s.directory || "").toLowerCase().includes(q));
  const box = $("sessions");
  if (!list.length) { box.innerHTML = `<div class="empty">${ICON("chat")}<h3>${q ? "没有匹配的会话" : "还没有会话"}</h3><p>${q ? "换个关键词试试" : "点击上方按钮创建第一个会话"}</p></div>`; return; }
  const sorted = [...list].sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
  box.innerHTML = `<div class="group-label">会话 · ${sorted.length}</div>` + sorted.map((s) => `
    <div class="session-item ${s.id === state.current ? "active" : ""}" data-id="${s.id}" title="${esc(s.directory || "")}">
      <span class="dot ${s.status}"></span>
      <div class="grow">
        <div class="title truncate">${esc(s.title)}</div>
        <div class="meta"><span class="mono">${shortId(s.id)}</span><span>·</span><span>${s.message_count} 条</span><span>·</span><span>${relTime(s.created_at)}</span></div>
      </div>
      <button class="ghost icon del" data-del="${s.id}" title="删除会话">${ICON("trash")}</button>
    </div>`).join("");
}
$("search").oninput = renderSessions;
$("sessions").addEventListener("click", async (e) => {
  const del = e.target.closest("[data-del]");
  if (del) {
    e.stopPropagation();
    const s = state.sessions.find((x) => x.id === del.dataset.del);
    if (!(await confirmDialog("删除会话", `删除「${s ? s.title : del.dataset.del}」及其全部消息？此操作不可撤销。`))) return;
    try { await api("DELETE", `/session/${del.dataset.del}`); toast("会话已删除", "ok"); } catch (err) { toast(err.message, "err"); }
    if (state.current === del.dataset.del) { state.current = null; state.messages = []; renderThread(); }
    await loadSessions();
    return;
  }
  const row = e.target.closest("[data-id]");
  if (row) selectSession(row.dataset.id);
});
async function selectSession(id) {
  state.current = id;
  renderSessions(); renderHead(); updateComposer(); renderInfo(); renderEvents(); renderPending();
  await loadMessages();
  $("prompt").focus();
}
function currentSession() { return state.sessions.find((s) => s.id === state.current) || null; }

/* ---------- 新建会话 ---------- */
const recentDirs = () => { try { return JSON.parse(localStorage.getItem("gw.recentDirs") || "[]"); } catch { return []; } };
function rememberDir(d) { try { localStorage.setItem("gw.recentDirs", JSON.stringify([d, ...recentDirs().filter((x) => x !== d)].slice(0, 8))); } catch {} }
function openNewSession() {
  const rec = recentDirs();
  $("recent-wrap").hidden = !rec.length;
  $("recent").innerHTML = rec.map((d) => `<span class="chip" data-dir="${esc(d)}" title="${esc(d)}">${ICON("folder")}<span class="truncate" style="max-width:220px">${esc(d)}</span></span>`).join("");
  $("new-session").showModal();
  $("new-dir").focus();
}
$("btn-new").onclick = openNewSession;
$("recent").addEventListener("click", (e) => { const c = e.target.closest("[data-dir]"); if (c) $("new-dir").value = c.dataset.dir; });
$("btn-create").onclick = async () => {
  const directory = $("new-dir").value.trim();
  if (!directory) { $("new-dir").focus(); toast("请填写工作目录", "err"); return; }
  try {
    const s = await api("POST", "/session", { directory, title: $("new-title").value.trim() || undefined });
    rememberDir(directory); $("new-title").value = ""; $("new-session").close();
    await loadSessions(); selectSession(s.id); toast("会话已创建", "ok");
  } catch (e) { toast(e.message, "err"); }
};
$("new-dir").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-create").click(); });

/* ---------- 目录浏览 ---------- */
const br = { path: null, parent: null, selected: null };
async function browse(path) {
  let data;
  try { data = await api("GET", `/fs/dirs${path ? `?path=${encodeURIComponent(path)}` : ""}`); } catch (e) { toast(e.message, "err"); return; }
  br.path = data.path; br.parent = data.parent; br.selected = null;
  $("br-path").value = data.path; $("br-current").textContent = data.path; $("br-up").disabled = !data.parent;
  $("br-roots").innerHTML = data.roots.map((r) => `<option value="${esc(r)}" ${data.path.startsWith(r) ? "selected" : ""}>${esc(r)}</option>`).join("");
  const sep = data.path.includes("\\") ? "\\" : "/";
  const parts = data.path.split(/[\\/]/).filter(Boolean);
  const root = data.path.match(/^([A-Za-z]:\\|\/)/)?.[1] || sep;
  let acc = root;
  const crumbs = [`<button data-go="${esc(root)}">${esc(root)}</button>`];
  parts.forEach((p, i) => { if (i === 0 && /^[A-Za-z]:$/.test(p)) return; acc = acc.endsWith(sep) ? acc + p : acc + sep + p; crumbs.push(`<span class="sep">${ICON("chev")}</span><button data-go="${esc(acc)}">${esc(p)}</button>`); });
  $("br-crumbs").innerHTML = crumbs.join("");
  $("br-list").innerHTML = data.entries.length
    ? data.entries.map((e) => `<div class="dir" data-path="${esc(e.path)}" title="${esc(e.path)}">${ICON("folder")}<span class="truncate">${esc(e.name)}</span></div>`).join("")
    : `<div class="empty"><p>没有子目录</p></div>`;
}
$("btn-browse").onclick = () => { $("browser").showModal(); browse($("new-dir").value.trim() || null); };
$("br-up").onclick = () => br.parent && browse(br.parent);
$("br-roots").onchange = (e) => browse(e.target.value);
$("br-path").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); browse($("br-path").value.trim()); } });
$("br-crumbs").addEventListener("click", (e) => { const b = e.target.closest("[data-go]"); if (b) browse(b.dataset.go); });
$("br-list").addEventListener("click", (e) => {
  const row = e.target.closest("[data-path]"); if (!row) return;
  document.querySelectorAll("#br-list .dir").forEach((d) => d.classList.toggle("active", d === row));
  br.selected = row.dataset.path; $("br-current").textContent = br.selected;
});
$("br-list").addEventListener("dblclick", (e) => { const row = e.target.closest("[data-path]"); if (row) browse(row.dataset.path); });
$("br-mkdir").onclick = async () => {
  const name = $("br-newname").value.trim(); if (!name) { $("br-newname").focus(); return; }
  try {
    const r = await api("POST", "/fs/dirs", { parent: br.path, name }); $("br-newname").value = "";
    await browse(br.path); br.selected = r.path; $("br-current").textContent = r.path;
    document.querySelectorAll("#br-list .dir").forEach((d) => d.classList.toggle("active", d.dataset.path === r.path));
    toast("文件夹已创建", "ok");
  } catch (e) { toast(e.message, "err"); }
};
$("br-pick").onclick = () => { $("new-dir").value = br.selected || br.path; $("browser").close(); };

/* ---------- 会话头 / 信息 ---------- */
function renderHead() {
  const s = currentSession(); const head = $("conv-head");
  if (!s) { head.innerHTML = `<span class="muted">未选择会话</span>`; return; }
  head.innerHTML = `
    <div class="grow">
      <div class="title truncate">${esc(s.title)}</div>
      <div class="sub">
        <span class="copyable mono" data-copy="${esc(s.id)}" title="复制会话 ID">${esc(s.id)} ${ICON("copy")}</span>
        <span class="copyable truncate" data-copy="${esc(s.directory || "")}" title="${esc(s.directory || "")}" style="max-width:420px">${ICON("folder")}<span class="truncate">${esc(s.directory || "")}</span></span>
      </div>
    </div>
    <span class="pill ${s.status}">${s.status}</span>`;
}
$("conv-head").addEventListener("click", (e) => { const c = e.target.closest("[data-copy]"); if (c) copyText(c.dataset.copy); });
function renderInfo() {
  const s = currentSession(); const box = $("info");
  if (!s) { box.innerHTML = `<div class="empty" style="grid-column:1/-1"><p>选择会话后显示详情</p></div>`; return; }
  const rows = [["ID", s.id], ["标题", s.title], ["目录", s.directory], ["创建时间", s.created_at], ["状态", s.status], ["消息数", String(s.message_count)], ["引擎", state.health ? state.health.engine : ""], ["模型", state.health ? state.health.model : ""]];
  box.innerHTML = rows.map(([k, v]) => `<div class="k">${k}</div><div class="v mono">${esc(v)}</div>`).join("");
}

/* ---------- 线程 ---------- */
async function loadMessages() {
  if (!state.current) { state.messages = []; renderThread(); return; }
  try { state.messages = await api("GET", `/session/${state.current}/message`); } catch (e) { toast(e.message, "err"); return; }
  renderThread(true);
}
function toolOutputs() {
  const map = {};
  for (const m of state.messages) if (m.role === "tool" && m.tool_call_id) map[m.tool_call_id] = m;
  return map;
}
function renderArgs(args) {
  if (!args || typeof args !== "object" || Array.isArray(args) || !Object.keys(args).length) return `<pre>${esc(pretty(args || {}))}</pre>`;
  const flat = Object.values(args).every((v) => v === null || ["string", "number", "boolean"].includes(typeof v));
  if (!flat) return `<pre>${esc(pretty(args))}</pre>`;
  return `<div class="kv">${Object.entries(args).map(([k, v]) => `<span class="k">${esc(k)}</span><span class="v">${esc(String(v))}</span>`).join("")}</div>`;
}
function renderToolPart(p, outputs) {
  const st = p.state || {}; const status = st.status || "running";
  const out = st.output ?? (outputs[p.call_id] ? outputs[p.call_id].content : null);
  const lines = out == null ? 0 : String(out).split("\n").length;
  return `<details class="tool" ${status === "running" ? "open" : ""}>
    <summary>${ICON("chev")}<span class="name">${esc(p.tool)}</span><span class="st ${status}">${status === "running" ? '<span class="dot"></span>' : ""}${status}</span><span class="title truncate">${esc(st.title || "")}</span></summary>
    <div class="body">
      <div><div class="label">参数</div>${renderArgs(p.arguments)}</div>
      ${out != null ? `<div><div class="label">输出 · ${lines} 行</div><pre class="${lines > 40 ? "clamp" : ""}">${esc(out)}</pre>${lines > 40 ? `<button class="ghost" data-expand style="margin-top:4px">展开全部</button>` : ""}</div>` : ""}
    </div>
  </details>`;
}
function renderMessage(m, outputs) {
  if (m.role === "user") return `<div class="msg user" data-mid="${m.id}"><div class="bubble">${esc(m.content)}</div><span class="stamp">${fmtTime(m.created_at)}</span></div>`;
  if (m.role === "tool") return "";
  const info = m.info || {}; const parts = m.parts || [];
  const running = !info.finish;
  const body = parts.map((p) => {
    if (p.type === "text") return `<div class="md">${md(p.content)}</div>`;
    if (p.type === "tool") return renderToolPart(p, outputs);
    return "";
  }).join("");
  const flags = [info.finish, info.aborted ? `aborted${info.aborted_reason ? ":" + info.aborted_reason : ""}` : "", info.error ? "error" : ""].filter(Boolean);
  return `<div class="msg assistant" data-mid="${m.id}"><div class="card">
    <div class="who"><span class="avatar">${ICON("bolt")}</span><span>assistant</span><span class="mono" style="margin-left:auto">${fmtTime(m.created_at)}</span></div>
    ${body || (running ? "" : `<span class="muted">（无文本）</span>`)}
    ${running ? `<div class="typing"><i></i><i></i><i></i></div>` : ""}
    ${flags.length ? `<div class="foot">${flags.map((f) => `<span class="${f.startsWith("error") ? "st error" : f.startsWith("aborted") ? "st running" : ""}">${esc(f)}</span>`).join("")}</div>` : ""}
  </div></div>`;
}
function renderInteractions() {
  return Object.values(state.pending).filter((p) => p.sessionID === state.current).map((p) => p.kind === "question"
    ? `<div class="interact" data-int="${p.id}"><div class="head">${ICON("help")}Agent 需要你的回答</div>${p.questions.map((q, qi) => `
        <div class="q">${esc(q.question)}</div>
        <div class="opts">${(q.options || []).map((o) => `<button data-q="${p.id}" data-ans="${esc(o.label)}" title="${esc(o.description || "")}">${esc(o.label)}</button>`).join("")}
        <input placeholder="自定义回答，回车提交" data-qfree="${p.id}"></div>`).join("")}</div>`
    : `<div class="interact" data-int="${p.id}"><div class="head">${ICON("shield")}权限请求 · <span class="mono">${esc(p.permission)}</span></div>
        <pre class="mono" style="margin:0;white-space:pre-wrap;color:var(--text-2)">${esc((p.patterns || []).join("\n"))}</pre>
        <div class="opts"><button data-perm="${p.id}" data-reply="once">仅本次允许</button><button data-perm="${p.id}" data-reply="always">总是允许</button><button class="danger" data-perm="${p.id}" data-reply="reject">拒绝</button></div></div>`).join("");
}
function renderThread(scroll = true) {
  const box = $("thread-inner");
  if (!state.current) { box.innerHTML = `<div class="empty" style="padding-top:120px">${ICON("chat")}<h3>选择或创建一个会话</h3><p>会话对应一个工作目录，Agent 在其中执行任务</p></div>`; return; }
  const outputs = toolOutputs();
  const html = state.messages.map((m) => renderMessage(m, outputs)).join("");
  box.innerHTML = (html || `<div class="empty" style="padding-top:100px">${ICON("bolt")}<h3>还没有消息</h3><p>在下方输入第一条指令</p></div>`) + renderInteractions();
  if (scroll) scrollToBottom();
}
function scrollToBottom() { const t = $("thread"); t.scrollTop = t.scrollHeight; }
function nearBottom() { const t = $("thread"); return t.scrollHeight - t.scrollTop - t.clientHeight < 80; }
$("thread").addEventListener("scroll", () => { $("to-bottom").hidden = nearBottom(); });
$("to-bottom").onclick = scrollToBottom;
$("thread").addEventListener("click", (e) => {
  const ex = e.target.closest("[data-expand]"); if (ex) { ex.previousElementSibling.classList.remove("clamp"); ex.remove(); return; }
  const q = e.target.closest("[data-q]"); if (q) return replyQuestion(q.dataset.q, q.dataset.ans);
  const p = e.target.closest("[data-perm]"); if (p) return replyPermission(p.dataset.perm, p.dataset.reply);
});
$("thread").addEventListener("keydown", (e) => { const i = e.target.closest("[data-qfree]"); if (i && e.key === "Enter" && i.value.trim()) replyQuestion(i.dataset.qfree, i.value.trim()); });
function applyPart(messageID, part) {
  let m = state.messages.find((x) => x.id === messageID);
  const stick = nearBottom();
  if (!m) { m = { id: messageID, role: "assistant", parts: [], info: {}, created_at: new Date().toISOString() }; state.messages.push(m); }
  m.parts = m.parts || [];
  if (part.type === "tool") { const i = m.parts.findIndex((p) => p.type === "tool" && p.call_id === part.call_id); if (i >= 0) m.parts[i] = part; else m.parts.push(part); }
  else if (part.type === "text") { const last = m.parts[m.parts.length - 1]; if (last && last.type === "text") last.content = part.content; else m.parts.push(part); }
  else if (part.type === "step-finish") { m.parts.push(part); }
  const html = renderMessage(m, toolOutputs());
  const el = document.querySelector(`[data-mid="${messageID}"]`);
  if (el) el.outerHTML = html; else {
    const inter = $("thread-inner").querySelector(".interact");
    const emptyEl = $("thread-inner").querySelector(".empty"); if (emptyEl) emptyEl.remove();
    if (inter) inter.insertAdjacentHTML("beforebegin", html); else $("thread-inner").insertAdjacentHTML("beforeend", html);
  }
  if (stick) scrollToBottom();
}

/* ---------- 输入区 ---------- */
const ta = $("prompt");
function autosize() { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 200) + "px"; }
ta.addEventListener("input", autosize);
ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendOrStop(); } });
function updateComposer() {
  const s = currentSession(); const busy = s && s.status === "busy";
  const btn = $("btn-send");
  btn.disabled = !s;
  btn.className = busy ? "danger" : "primary";
  btn.innerHTML = busy ? `${ICON("stop")}<span>停止</span>` : `${ICON("send")}<span>发送</span>`;
  ta.disabled = !s;
  $("turn-state").textContent = s ? (busy ? "Agent 正在处理…" : "") : "";
}
$("btn-send").onclick = sendOrStop;
async function sendOrStop() {
  const s = currentSession(); if (!s) return;
  if (s.status === "busy") { try { await api("POST", `/session/${s.id}/abort`); toast("已发送中止请求"); } catch (e) { toast(e.message, "err"); } return; }
  const text = ta.value.trim(); if (!text) return;
  const sid = s.id; ta.value = ""; autosize();
  const emptyEl = $("thread-inner").querySelector(".empty"); if (emptyEl) emptyEl.remove();
  const local = { id: "local-" + Date.now(), role: "user", content: text, created_at: new Date().toISOString() };
  state.messages.push(local); $("thread-inner").insertAdjacentHTML("beforeend", renderMessage(local, {})); scrollToBottom();
  setStatus(sid, "busy");
  const model = { providerID: "gateway", modelID: state.health ? state.health.model : "" };
  try { await api("POST", `/session/${sid}/prompt_async`, { parts: [{ type: "text", text }], model, agent: "assistant" }); }
  catch (e) { if (state.current === sid) $("thread-inner").insertAdjacentHTML("beforeend", `<div class="errbar">${ICON("alert")}<span>${esc(e.message)}</span></div>`); toast(e.message, "err"); }
  if (state.current === sid) await loadMessages();
  await loadSessions();
}
function setStatus(sid, status) { const s = state.sessions.find((x) => x.id === sid); if (s) s.status = status; renderSessions(); renderHead(); updateComposer(); }

/* ---------- 待处理 ---------- */
function renderPending() {
  const items = Object.values(state.pending); const box = $("pending");
  $("pending-count").textContent = items.length ? String(items.length) : "";
  if (!items.length) { box.innerHTML = `<div class="empty">${ICON("help")}<h3>没有待处理请求</h3><p>Agent 的反问和权限请求会出现在这里</p></div>`; return; }
  box.innerHTML = items.map((p) => `<div class="pending-item">
      <div class="k">${p.kind === "question" ? "反问" : "权限"} · ${esc(p.sessionID)} ${p.sessionID !== state.current ? `<button class="ghost" data-jump="${p.sessionID}" style="padding:0 4px">跳转</button>` : ""}</div>
      ${p.kind === "question" ? p.questions.map((q) => `<div>${esc(q.question)}</div><div class="opts row" style="flex-wrap:wrap">${(q.options || []).map((o) => `<button data-q="${p.id}" data-ans="${esc(o.label)}">${esc(o.label)}</button>`).join("")}</div>`).join("")
        : `<div class="mono">${esc(p.permission)}</div><div class="mono muted" style="white-space:pre-wrap">${esc((p.patterns || []).join("\n"))}</div><div class="row"><button data-perm="${p.id}" data-reply="once">once</button><button data-perm="${p.id}" data-reply="always">always</button><button class="danger" data-perm="${p.id}" data-reply="reject">reject</button></div>`}
    </div>`).join("");
}
$("pending").addEventListener("click", (e) => {
  const j = e.target.closest("[data-jump]"); if (j) return selectSession(j.dataset.jump);
  const q = e.target.closest("[data-q]"); if (q) return replyQuestion(q.dataset.q, q.dataset.ans);
  const p = e.target.closest("[data-perm]"); if (p) return replyPermission(p.dataset.perm, p.dataset.reply);
});
async function replyQuestion(id, answer) {
  try { await api("POST", `/question/${id}/reply`, { answers: [[answer]] }); toast(`已回答：${answer}`, "ok"); } catch (e) { toast(e.message, "err"); }
  delete state.pending[id]; renderPending(); document.querySelectorAll(`[data-int="${id}"]`).forEach((n) => n.remove());
}
async function replyPermission(id, reply) {
  try { await api("POST", `/permission/${id}/reply`, { reply }); toast(`权限：${reply}`, reply === "reject" ? "err" : "ok"); } catch (e) { toast(e.message, "err"); }
  delete state.pending[id]; renderPending(); document.querySelectorAll(`[data-int="${id}"]`).forEach((n) => n.remove());
}

/* ---------- 事件 ---------- */
const evCategory = (t) => t.startsWith("server") ? "server" : t === "session.error" ? "error" : t.startsWith("session") ? "session" : t.startsWith("message") ? "message" : t.startsWith("question") ? "question" : "permission";
function evSummary(e) {
  const p = e.properties || {};
  if (e.type === "session.status") return `status → ${p.status && p.status.type}`;
  if (e.type === "message.part.updated") { const part = p.part || {}; return part.type === "text" ? `text · ${(part.content || "").length} chars` : part.type === "tool" ? `tool · ${part.tool} · ${part.state && part.state.status}` : part.type; }
  if (e.type === "session.error") return p.error && p.error.message;
  if (e.type === "question.asked") return (p.questions || []).map((q) => q.question).join(" / ");
  if (e.type === "permission.asked") return p.permission;
  return "";
}
function renderEvents() {
  const only = $("ev-current").checked && state.current; const f = $("ev-filter").value.trim().toLowerCase();
  const list = state.events.filter((e) => (!only || !e.properties.sessionID || e.properties.sessionID === state.current) && (!f || e.type.includes(f)));
  const box = $("events");
  if (!list.length) { box.innerHTML = `<div class="empty"><p>暂无事件</p></div>`; return; }
  const stick = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = list.slice(-400).map((e) => `<div class="ev c-${evCategory(e.type)}" data-ev="${e._i}">
      <div class="line"><span class="t">${e.type}</span>${e.properties.sessionID ? `<span class="mono muted">${shortId(e.properties.sessionID)}</span>` : ""}<span class="time">${e._t}</span></div>
      ${evSummary(e) ? `<div class="sum truncate">${esc(evSummary(e))}</div>` : ""}
      <pre>${esc(JSON.stringify(e.properties, null, 2))}</pre>
    </div>`).join("");
  if (stick) box.scrollTop = box.scrollHeight;
}
$("events").addEventListener("click", (e) => { const row = e.target.closest(".ev"); if (row) row.classList.toggle("open"); });
$("ev-filter").oninput = renderEvents; $("ev-current").onchange = renderEvents;
$("ev-clear").onclick = () => { state.events = []; renderEvents(); };
$("ev-pause").onclick = () => { state.evPaused = !state.evPaused; $("ev-pause").innerHTML = ICON(state.evPaused ? "play" : "pause"); $("ev-pause").title = state.evPaused ? "继续" : "暂停"; };
let evSeq = 0;
function onEvent(ev) {
  const p = ev.properties || {};
  if (ev.type !== "server.heartbeat" && !state.evPaused) {
    state.events.push({ ...ev, _i: evSeq++, _t: new Date().toLocaleTimeString("zh-CN", { hour12: false }) });
    if (state.events.length > 3000) state.events.shift();
    renderEvents();
  }
  switch (ev.type) {
    case "session.status": setStatus(p.sessionID, p.status.type); if (p.status.type === "idle" && p.sessionID === state.current) loadMessages().then(loadSessions); break;
    case "session.idle": setStatus(p.sessionID, "idle"); break;
    case "session.error": if (p.sessionID === state.current) { $("thread-inner").insertAdjacentHTML("beforeend", `<div class="errbar">${ICON("alert")}<span>${esc(p.error.message)}</span></div>`); scrollToBottom(); } toast(`会话出错：${p.error.message}`, "err"); break;
    case "message.part.updated": if (p.sessionID === state.current) applyPart(p.messageID, p.part); break;
    case "question.asked": state.pending[p.id] = { kind: "question", ...p }; renderPending(); if (p.sessionID === state.current) renderThread(true); break;
    case "permission.asked": state.pending[p.id] = { kind: "permission", ...p }; renderPending(); if (p.sessionID === state.current) renderThread(true); break;
  }
}
document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("active", x === t));
  document.querySelectorAll(".panel").forEach((pn) => pn.classList.toggle("active", pn.id === `panel-${t.dataset.tab}`));
}));
function connect() {
  const es = new EventSource("/event");
  es.onopen = () => { $("sse-dot").classList.add("idle"); $("sse-state").textContent = "已连接"; loadSessions(); };
  es.onmessage = (m) => onEvent(JSON.parse(m.data));
  es.onerror = () => { $("sse-dot").classList.remove("idle"); $("sse-state").textContent = "重连中"; es.close(); setTimeout(connect, 3000); };
}

/* ---------- 启动 ---------- */
(async () => {
  let theme = "system"; try { theme = localStorage.getItem("gw.theme") || "system"; if (localStorage.getItem("gw.inspector") === "0") $("app").classList.add("inspector-collapsed"); } catch {}
  applyTheme(theme);
  renderHead(); renderThread(false); renderInfo(); renderPending(); renderEvents(); updateComposer();
  await loadHealth();
  await loadSessions();
  try {
    const [qs, ps] = await Promise.all([api("GET", "/question"), api("GET", "/permission")]);
    qs.forEach((q) => (state.pending[q.id] = { kind: "question", ...q })); ps.forEach((q) => (state.pending[q.id] = { kind: "permission", ...q }));
    renderPending();
  } catch {}
  connect();
})();
</script>
</body>
</html>
